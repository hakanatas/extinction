<!-- Kaydırmalı "yok oluş" bölümünün kaynağı: şeffaf zemin üzerinde
     gradyanla dolu bir büyük kedi silueti. Şeffaflık, siluetin doğrudan
     alfa kanalından okunmasını sağlar; gradyan da mozaiğin düz bir leke
     yerine hacimli çıkmasına yarar. Gradyan userSpaceOnUse: tek bir ışık
     tüm parçaların üzerinden geçsin, her parça kendi gradyanını
     tekrarlayıp dikiş izi bırakmasın. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800">
  <defs>
    <linearGradient id="pelt" gradientUnits="userSpaceOnUse" x1="120" y1="720" x2="900" y2="180">
      <stop offset="0%" stop-color="#6d2a10"/>
      <stop offset="34%" stop-color="#c9521f"/>
      <stop offset="68%" stop-color="#f0913a"/>
      <stop offset="100%" stop-color="#fbd489"/>
    </linearGradient>
  </defs>

  <g fill="url(#pelt)" stroke="url(#pelt)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M300 430 C 208 424, 152 366, 150 272" fill="none" stroke-width="30"/>
    <circle cx="150" cy="264" r="17"/>

    <path d="M330 540 L 310 660 L 272 700" fill="none" stroke-width="36"/>
    <path d="M398 548 L 386 666 L 348 706" fill="none" stroke-width="36"/>
    <path d="M608 545 L 600 668 L 562 706" fill="none" stroke-width="34"/>
    <path d="M672 538 L 668 664 L 630 702" fill="none" stroke-width="34"/>

    <ellipse cx="360" cy="440" rx="135" ry="125"/>
    <ellipse cx="500" cy="440" rx="185" ry="105"/>
    <ellipse cx="630" cy="435" rx="125" ry="118"/>

    <path d="M690 395 L 762 330" fill="none" stroke-width="110"/>

    <ellipse cx="790" cy="300" rx="82" ry="72"/>
    <ellipse cx="850" cy="322" rx="46" ry="36"/>
    <path d="M735 240 L 752 182 L 792 232 Z"/>
    <path d="M812 222 L 846 176 L 862 236 Z"/>
  </g>
</svg>
