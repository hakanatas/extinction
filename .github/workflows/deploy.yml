# Statik dışa aktarımı GitHub Pages'e yayınlar.
# Deponun Settings → Pages sayfasında Source olarak "GitHub Actions" seçili olmalı.
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/vibrant-ramanujan-a03i1i
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Yayın sırası korunur; devam eden bir yayın iptal edilmez.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static export
        env:
          # Proje sayfası /<repo> altında yayınlanır.
          NEXT_PUBLIC_BASE_PATH: ${{ github.event.repository.name != format('{0}.github.io', github.repository_owner) && format('/{0}', github.event.repository.name) || '' }}
          # Galeri deponun kendisinde durduğu için yönetici yayınları buraya
          # commit atar. Değerler yapılan depodan geldiği için fork'ta ya da
          # dal adı değiştiğinde elle düzeltme gerekmez.
          NEXT_PUBLIC_REPO: ${{ github.repository }}
          NEXT_PUBLIC_REPO_BRANCH: ${{ github.ref_name }}
        run: npm run build

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
